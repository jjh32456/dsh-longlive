# Defaults are intentionally complete: the plugin works with this file as-is.
# The memory root defaults to <DSH home>/longlive-memory (created on first use)
# and can be overridden here, or by DSH_LONGLIVE_MEMORY_ROOT / legacy DSH_MEM.
# Uncomment and edit only if you want a specific location:
#         memoryRoot: <memory-root>
# Router policy defaults to the generic profile (no personal house rules).
# Override with a name from src/router/policies/<name>.json:
#         routerPolicyProfile: owner-rulings-2026-11-03
#
# 1.8.8: forced recall + link layer (M2). Every real user task message now forces
# one recall at agent/pre-step step 1 — `autoRecall.forceOnUserMessage` (default
# true; explicit false restores the 1.8.7 turn/topic trigger behaviour exactly).
# Pure acknowledgements (好/嗯/ok/继续/谢谢/收到) never force. Recall now has a
# word→old-card link layer: `recall.links.enabled` (default true; enabled:false =
# 1.8.7 behaviour) direct-connects cards from `.longlive/recall/links.jsonl`, and
# `recall.links.learn` (default true) nudges link weights from user confirm/deny
# feedback (atomic write + backup + audit; decay after 30 days unused). Old-turn
# archive fallback is used only when ordinary recall + links both come up empty.
# Budget/dedupe/privacy are unchanged: ≤5 cards, ≤2000 tokens, already-injected
# cards deduped, privacy-hit cards dropped whole, every failure fail-open.
# The seed table is rebuilt offline from LINKS-SEED-v3.csv with
#   node scripts/recall-links-build.mjs --csv <seed.csv> --memory-root <root>
# (`--dry-run` prints stats; `--rollback <backup>` restores a backup atomically).
# 1.8.9: visible-truncate boundary fix — a retained compaction checkpoint whose
# replaced span starts before the cut no longer deadlocks the auto-truncate
# planner: the boundary moves after the checkpoint instead of walking back into
# it. ACP-bridge messages (kind:"user" + rpcId, no clientTimeZone) count as
# user-authored unless their text matches the injected-block blacklist. No
# config keys change; defaults are untouched.
# 1.8.8: the shared-brain activity board keeps a time-based live window
# (`sharedBrain.activity.retainHours`, default 24h, plus a `recentMaxRows` row
# guard) instead of a flat 500-row cap; rows outside the window move to
# activity-YYYYMM.jsonl (never deleted, still findable by seq). A new session (or
# one whose own recap is older than retainHours) also gets one ≤400-char recap of
# the ≤3 sessions active in the window, built only from existing board rows.
# Defaults change: retainHours 24 / recentMaxRows 3200 / summaryMaxChars 400.
# 1.8.7: router startup anchor verification now counts `budget.overshoot.applied`

# when a reservation has no matching `budget.settle` (fixes a false
# E_LEDGER_TAMPERED / audit_used_regressed block after an overshoot). No defaults,
# tool surface or config keys change.
# 1.8.6: autoProcedure (local-rule procedure candidates) is OFF by default and
# adds no hooks, no reads and no timers unless a profile opts in. When enabled it
# writes candidates under .longlive/staging/auto-cards/procedures/ only; promotion
# stays a manual memory_procedure save. No tool surface change.
# 1.8.5: hotfix — the tool layer never received `config.tiering`, so tiering.mode:'filter'
# silently behaved as shadow. The wiring now passes tiering through; regression test
# (test/wiring-tiering-config.test.mjs) pins it.
# 1.8.4: memory upgrades 2/3/4 (cross-session handoff / hot-warm-cold tiers /
# proactive surfacing) are opt-in and default OFF; this patch keeps the 1.8.3
# defaults below byte-identical unless the profile config opts in.
# 1.8.3: subtraction D1-D5 (D2 default-on lineage) / engram 0.13.9 + A1 migration.
# 1.8.0 product default: features are all enabled here. Explicit false opts out; enabling one never enables
# another. When several are on, message order is [user, boot, runtime, auto]:
# boot is the identity open card (agent/pre-step, prepend:true) and auto is
# recall (agent/pre-step, prepend:false). TurnNavigator / firstUserText locates
# the first real user message, so the boot card is never placed above it.
# See docs/FEATURES.md for the full switch matrix and rollback steps.
#
# 0.9.0-rc.2: on activation, read the unattended-surgery stage file (if any)
# and write one read-only recovery report. No stage file -> no read, no log.
# Set false only if you never run scripts/unattended-surgery.ps1.
# 1.6.3: hot truncate replaces the stock compaction engine. The bundle patch
# disables compaction-basic and inserts the cut-only engine. entry.js falls back
# to stock if the engine cannot load, so /compact keeps working. The engine only
# cuts completed turns older than the retention window and never cuts the
# system prompt.
- id: compaction-basic
  disabled: true
- insert:
    - id: compaction-hot-truncate
      name: '@jjh32456/dsh-longlive/compaction'
      config:
        hotTruncate:
          mode: cut
          retainTurns: 4
          retainTokens: 8000
          autoMinTokens: 350000
          minCutTokens: 0
- insert:
    - id: session-longlive
      name: '@jjh32456/dsh-longlive'
      config:
        keepEvents: 20000
        recentWriteWindowMs: 60000
        routerPolicyProfile: generic
        surgeryRecovery: true
        # 1.6.0 safety default: no router evaluation unless this is explicitly
        # set to shadow|on. 'shadow' records every tool call (args included) to
        # <memoryRoot>/.longlive/router-runtime.jsonl; the old default was
        # shadow, now it is off. shadowEnabled stays accepted for old profiles.
        # Quote it so a YAML 1.1 reader cannot turn off into a boolean.
        routerRuntime: 'off'
        # 1.6.0 safety default: the fan-out tools stay in the 22-tool surface
        # but every worker_spawn/worker_status/worker_kill call returns
        # "unavailable" until this is true.
        workers:
          enabled: true
        # 1.6.0 release default: automatic visible truncation is OFF in the
        # plugin code as well as here (enabled:true / mode:dryrun). To opt out,
        # set enabled:true and pick mode log|dryrun|request; request mode also
        # needs the out-of-app runner/watchdog to act.
        autoTruncate:
          enabled: true
          mode: dryrun
        # 1.2.0: passive observers are ON by default so the panel shows live
        # data out of the box. Both are fail-open and never call an LLM.
        #   filterEnabled -> <memoryRoot>/.longlive/filter/decisions-*.jsonl
        #   shadowEnabled -> <memoryRoot>/.longlive/router-runtime.jsonl
        # Setting either false only disables that one; the panel falls back to
        # its "未启用/样例" view instead of erroring.
        filterEnabled: true
        shadowEnabled: true
        autoRecall:
          enabled: true
          topK: 3
          budgetTokens: 2000
          everyNTurns: 6
          # 1.8.8 (M2): every real user task message forces exactly one recall
          # at agent/pre-step step 1, bypassing the everyNTurns/quiet gates;
          # pure acknowledgements (≤6 chars, no task verb) never force. true is
          # the 1.8.8 default; explicit false restores the exact 1.8.7 trigger.
          forceOnUserMessage: true
        # 1.8.8 (M2): word→old-card link layer. Reads
        # <memoryRoot>/.longlive/recall/links.jsonl, built offline from
        # LINKS-SEED-v3.csv by `node scripts/recall-links-build.mjs`. enabled:
        # false restores 1.8.7 keyword/semantic recall; learn: true nudges edge
        # weights from user confirm/deny (atomic write + backup + audit;
        # 30-day-unused decay; ≤5 cards/term, ≤50 terms/card). Both blocks are
        # passthrough keys (no schemastery leaf), read from the raw config row.
        recall:
          links:
            enabled: true
            learn: true
        identityCard:
          enabled: true
          path: '<memoryRoot>/STATE.md'
        # 1.8.6: local-rule procedure candidates. Off by default; enabling it adds
        # one session/event listener + one resettable timer per session, writes only
        # to <memoryRoot>/.longlive/staging/ and never promotes anything by itself.
        autoProcedure:
          enabled: false
          # 1.8.6 复审修复：解压后采样上限（字节）。超过时降级为尾段窗口解析；
          # 硬上限 67108864，低于下限 65536 时回落到默认 8388608。
          maxDecompressBytes: 8388608
        presenceBus:
          enabled: true
          pollMs: 3000
        # 1.6.8: shared-brain activity stream (event-level writes, merged from the
        # 1.6.1-rc.1 batch). On by default in 1.8.0; independent of presenceBus. When on,
        # activity events append rows to <memoryRoot>/.longlive/board/activity.jsonl
        # and agent/pre-step injects only rows newer than this session's lastSeenSeq. On by default in 1.8.0.
        # 1.8.8: the shared-brain live board window is time-based (retainHours=24h);
        # rows older than the window move to activity-YYYYMM.jsonl (never deleted,
        # still findable by seq) and recentMaxRows=3200 is the row guard. A new
        # session also gets one ≤400-char recap of the ≤3 sessions active in the
        # window (summaryMaxChars), built only from existing board rows. The unread
        # per-line injection and the 5-line thinking section are unchanged.
        sharedBrain:
          activity:
            enabled: true
            injectMaxChars: 300
            maxItems: 5
            retainHours: 24
            recentMaxRows: 3200
            summaryMaxChars: 400
        # 1.6.9: memory/recall/forget v2 panel API (M2-F 16 read-only routes +
        # M2-G 16 actions + HMAC audit + panel integrity). On by default; when
        # off, NO route is registered and no v2 file is created (behaviour = 1.6.8). On by default in 1.8.0.
        memoryV2:
          enabled: true
